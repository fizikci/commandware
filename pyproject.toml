[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commandware"
version = "0.1.0"
description = "ESP8266-style command pipeline simulator for the Commandware PRD"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OpenAI" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
commandware = "commandware.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
